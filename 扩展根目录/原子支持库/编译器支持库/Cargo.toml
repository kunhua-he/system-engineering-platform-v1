# 编译器支持库 —— 独立工作区（扩展不属于底座工作区：底座不认识任何扩展）
[package]
name = "v1-compiler"
description = "编译器支持库 —— 后端能力：词法 · 语法 · 语义 · 生成 · 反解 · 诊断。前端是纯 UI，不在本扩展里。"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
name = "v1_compiler"
path = "src/lib.rs"

[dependencies]
# 扩展只读契约：只依赖底座公布的契约，不依赖底座任何内部节点
v1-contract = { path = "../../../契约声明" }

[workspace]

# ── Clippy 严格基线的**精确放行**（本 crate 是独立工作区，继承不到根那份）──
#
# ★ 为什么落在这里而不是根 `[workspace.lints.rust]`：根那份是**整个根工作区**的，放那里会把
#   **手写件**里真正没人用的代码一起放过去。实查（`cargo clippy --all-targets`）：本 crate 的
#   `dead_code` / `unused_imports` 告警**全部**来自下面三类，没有一条是「手写代码里有个
#   没人调的函数」：
#
#   ① **生成数据表按源全量生成**（`src/*数据.rs` 由 `构建装配/形态装配/生成声明.py` 出）——
#      一份声明的完整表里只有**当前装配可达**的那部分会被引用，其余按源如实生成。可达性不是
#      完整性判据；按「没人用」删表项 = 让生成物背离声明源。生成物禁手改（本仓硬规）。
#      实测 140 条（`错误码数据.rs` 76 · `通知常量推导数据.rs` 32 · `平台与类型数据.rs` 26 ·
#      `命令类别数据.rs` 6）。
#   ② **`#[cfg(test)]` 子树**（`执行函数面/本机生成/`）—— 整棵子树只在测试目标下编译，在 lib
#      目标下恒判 dead；而它正是本 crate「真执行体」的读数所在。
#   ③ **扫描器 / 登记面**（`编号与码面/错误码定义.rs` 的 `码项` + `错误码信息表`）—— 文件头
#      写明：实现侧扫描器在同一份文件里解析这两项。**扫描器不是 Rust 调用方**，rustc 看不见它。
#
#   口径与根那份一致：**除这两条外一律不许 allow**，能真修的一律真修。
[lints.rust]
dead_code = "allow"
unused_imports = "allow"
