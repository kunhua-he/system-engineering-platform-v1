<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>反馈看板 · 债务按资料组实时</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#1c2024;
 font:13px/1.55 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
header{background:#14202b;color:#e8edf2;padding:14px 20px}
header h1{margin:0 0 5px;font-size:17px;font-weight:600}
header .sub{font-size:12px;color:#9fb0c0;line-height:1.7}
.kpis{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}
.kpi{background:#22303d;border-radius:6px;padding:6px 11px;min-width:78px}
.kpi b{display:block;font-size:17px;color:#fff;font-weight:600}
.kpi span{font-size:11px;color:#9fb0c0}
.banner{margin:10px 20px 0;padding:9px 12px;border-radius:6px;font-size:12.5px;display:none}
.banner.bad{display:block;background:#fdecea;color:#a93226;border:1px solid #f2c4bf}
.banner.stale{display:block;background:#fef5e7;color:#9c640c;border:1px solid #f3ddb4}
.bar{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid #dfe3e8;
 padding:8px 20px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
input[type=search],input[type=text]{padding:5px 9px;border:1px solid #ccd2d9;border-radius:6px;font-size:12.5px}
input[type=search]{min-width:200px;flex:1}
select{padding:5px 7px;border:1px solid #ccd2d9;border-radius:6px;background:#fff;font-size:12.5px}
button{padding:5px 10px;border:1px solid #ccd2d9;background:#fff;border-radius:6px;cursor:pointer;font-size:12.5px}
button:hover{background:#eef1f4}
label.chk{font-size:12.5px;color:#4a555f;display:flex;align-items:center;gap:4px}
.wrap{padding:0 20px 70px}
.note{margin:12px 0 0;padding:8px 11px;background:#eef4fb;border:1px solid #d3e0f0;border-radius:6px;
 font-size:12px;color:#33485f;line-height:1.6}
h2{font-size:14px;margin:16px 0 6px;color:#33414d}
table{border-collapse:separate;border-spacing:0;width:100%;background:#fff;margin-top:8px;
 border:1px solid #dfe3e8;border-radius:8px;overflow:hidden}
th{background:#eef1f4;text-align:left;padding:7px 8px;font-size:11.5px;color:#4a555f;
 font-weight:600;white-space:nowrap;border-bottom:1px solid #dfe3e8}
td{padding:6px 8px;border-bottom:1px solid #eef1f4;vertical-align:top;font-size:12.5px}
tr:last-child td{border-bottom:0}
tr.g:hover td{background:#f0f6ff;cursor:pointer}
tr.g.sel td{background:#e3efff}
tr.e:hover td{background:#fafbfc}
.no{font-weight:600;color:#33414d;white-space:nowrap;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#5a6672;word-break:break-all;max-width:230px}
.ph{max-width:360px}
.tag{display:inline-block;padding:1px 6px;border-radius:9px;font-size:11px;background:#eef1f4;color:#4a555f;white-space:nowrap}
.tag.债务{background:#fdecea;color:#a93226}
.tag.非问题{background:#e8f5e9;color:#1d6b2f}
.tag.待核{background:#fef5e7;color:#9c640c}
.tag.ok{background:#e8f5e9;color:#1d6b2f}
.tag.no{background:#fdecea;color:#a93226}
.unk{color:#9c640c}
.pg{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:12.5px;color:#4a555f}
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #dfe3e8;
 padding:6px 20px;font-size:11.5px;color:#7b8794;display:flex;gap:16px;flex-wrap:wrap}
</style></head>
<body>
<header>
  <h1>反馈看板 · 债务按现行判词的关联目标分资料组</h1>
  <div class="sub">只读实时：每次刷新从开工账本库一条读事务取六表同快照 + 唯一台账现量。
    <span id="时刻">生成时刻：—</span> · <span id="版本">库版本：—</span></div>
  <div class="kpis" id="kpis"></div>
</header>
<div id="横幅" class="banner"></div>
<div class="bar">
  <select id="判词" title="判词筛选">
    <option value="债务">判词：债务</option>
    <option value="非问题">判词：非问题</option>
    <option value="待核">判词：待核</option>
    <option value="全部">判词：全部</option>
  </select>
  <input id="任务" type="search" placeholder="筛任务：关联目标 / 开工工作内容 / 台账缺什么">
  <input id="来源" type="text" placeholder="筛来源：来源号 或 来源标识">
  <select id="每页" title="每页条数">
    <option value="25">每页 25</option>
    <option value="50" selected>每页 50</option>
    <option value="100">每页 100</option>
    <option value="200">每页 200</option>
  </select>
  <button id="刷新">刷新</button>
  <button id="清筛">清筛</button>
  <label class="chk"><input type="checkbox" id="自动" checked> 10 秒自动刷新</label>
</div>
<div class="wrap">
  <div class="note" id="口径"></div>
  <h2>资料组（按现行判词的关联目标；<b>组数 ≠ 独立问题数</b>）</h2>
  <table id="组表"><thead><tr>
    <th>资料组</th><th>关联种类</th><th>关联目标</th><th>关联状态</th><th>承接</th><th>条数</th>
  </tr></thead><tbody></tbody></table>
  <h2 id="条目标题">条目</h2>
  <table id="条目表"><thead><tr>
    <th>来源号</th><th>报告指纹</th><th>报告路径</th><th>条目（现象）</th><th>判词</th>
    <th>并入主条目</th><th>承接任务</th><th>关闭提交</th><th>核验</th>
  </tr></thead><tbody></tbody></table>
  <div class="pg" id="分页"></div>
</div>
<footer>
  <span>只读：不写库 · 不暴露任意文件 / SQL 接口</span>
  <span>旧 474 簇 / 58 债务摘要的映射未落盘 ⇒ 本页不做旧映射，只按现行关联实时归组</span>
</footer>
<script>
const 状态 = {页码: 1, 组: ""};
const $ = (id) => document.getElementById(id);
const 文本 = (v) => (v === null || v === undefined) ? "" : String(v);
const 转义 = (v) => 文本(v).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

function 拼查询() {
  const p = new URLSearchParams();
  p.set("页码", 状态.页码);
  p.set("每页", $("每页").value);
  p.set("判词", $("判词").value);
  if ($("任务").value.trim()) p.set("任务", $("任务").value.trim());
  if ($("来源").value.trim()) p.set("来源", $("来源").value.trim());
  if (状态.组) p.set("组", 状态.组);
  return p.toString();
}

function 画KPI(载荷) {
  const t = 载荷.总览 || {};
  const 卡 = [
    ["来源", t.来源], ["条目", t.条目], ["判词", t.判词], ["债务", t.债务],
    ["证据", t.证据], ["关闭", t.关闭], ["台账现量", (载荷.台账 || {}).现量],
  ];
  $("kpis").innerHTML = 卡.map(([k, v]) =>
    `<div class="kpi"><b>${转义(v === undefined ? "—" : v)}</b><span>${转义(k)}</span></div>`).join("");
}

function 画组(载荷) {
  const 组表 = 载荷.组 || [];
  $("组表").querySelector("tbody").innerHTML = 组表.map((g) => {
    const 选 = (状态.组 && g.组键 === 状态.组) ? " sel" : "";
    const 承接 = g.承接有效 ? '<span class="tag ok">有效</span>' : '<span class="tag no">缺</span>';
    return `<tr class="g${选}" data-键="${转义(g.组键)}">`
      + `<td class="ph">${转义(g.组名)}</td>`
      + `<td>${转义(g.关联种类 || "—")}</td><td class="mono">${转义(g.关联目标 || "—")}</td>`
      + `<td>${转义(g.关联状态 || "—")}</td><td>${承接}</td>`
      + `<td class="no">${转义(g.条数)}</td></tr>`;
  }).join("") || '<tr><td colspan="6" class="unk">无资料组</td></tr>';
  $("组表").querySelectorAll("tr.g").forEach((tr) => tr.onclick = () => {
    状态.组 = (状态.组 === tr.dataset.键) ? "" : tr.dataset.键;
    状态.页码 = 1; 拉数();
  });
}

function 画条目(载荷) {
  const 条目 = 载荷.条目 || [];
  $("条目标题").textContent = `条目（本页 ${条目.length} 条）`;
  $("条目表").querySelector("tbody").innerHTML = 条目.map((e) => {
    const 并入 = e.并入主条目 ? ("→ #" + 转义(e.并入主条目)) : "—";
    return `<tr class="e">`
      + `<td class="no">${转义(e.来源号)}</td>`
      + `<td class="mono" title="${转义(e.报告指纹全)}">${转义(e.报告指纹)}</td>`
      + `<td class="mono" title="${转义(e.报告路径)}">${转义(e.报告路径 || "—")}</td>`
      + `<td class="ph" title="${转义(e.理由 || "")}">#${转义(e.条目号)} ${转义(e.现象)}</td>`
      + `<td><span class="tag ${转义(e.判词)}">${转义(e.判词)}</span></td>`
      + `<td>${并入}</td>`
      + `<td class="ph">${转义(e.承接任务)}</td>`
      + `<td class="mono">${转义(e.关闭提交)}</td>`
      + `<td class="ph">${转义(e.核验)}</td></tr>`;
  }).join("") || '<tr><td colspan="9" class="unk">无条目</td></tr>';
}

function 画分页(载荷) {
  const f = 载荷.分页 || {页码: 1, 总页: 0, 总数: 0};
  const 总页 = f.总页 || 0;
  const 上 = Math.max(1, (f.页码 || 1) - 1);
  const 下 = Math.min(总页 || 1, (f.页码 || 1) + 1);
  $("分页").innerHTML = `共 ${转义(f.总数)} 条 · 第 ${转义(f.页码)} / ${转义(总页)} 页　`
    + `<button ${f.页码 <= 1 ? "disabled" : ""} data-页="${上}">上一页</button>`
    + `<button ${(总页 === 0 || f.页码 >= 总页) ? "disabled" : ""} data-页="${下}">下一页</button>`;
  $("分页").querySelectorAll("button").forEach((b) => b.onclick = () => {
    状态.页码 = parseInt(b.dataset.页, 10) || 1; 拉数();
  });
}

function 画横幅(载荷) {
  const 框 = $("横幅");
  const 错 = 载荷.错误 || [];
  if (错.length) {
    框.className = "banner bad";
    框.textContent = "读失败（陈旧，不报新鲜）：" + 错.join(" ｜ ");
  } else if (载荷.陈旧) {
    框.className = "banner stale";
    框.textContent = "数据陈旧（时间 / 版本未核实）";
  } else {
    框.className = "banner";
    框.textContent = "";
  }
}

function 画时刻(载荷) {
  const v = 载荷.库版本 || {};
  const 陈旧 = 载荷.陈旧 ? "（陈旧）" : "";
  $("时刻").textContent = "生成时刻：" + (载荷.生成时刻 || "—") + 陈旧;
  $("版本").textContent = "库版本：" + (v.字节 === undefined ? "—"
    : (v.字节 + " 字节 · " + new Date(v.修改时刻 * 1000).toLocaleString()));
}

async function 拉数() {
  try {
    const 回 = await fetch("/api/数据?" + 拼查询(), {cache: "no-store"});
    const 载荷 = await 回.json();
    画KPI(载荷); 画横幅(载荷); 画时刻(载荷); 画组(载荷); 画条目(载荷); 画分页(载荷);
    $("口径").innerHTML = "口径：" + 转义(载荷.口径 || "") + "　｜　台账："
      + 转义((载荷.台账 || {}).件 || "—");
  } catch (e) {
    $("横幅").className = "banner bad";
    $("横幅").textContent = "取数失败（网络 / 服务）：" + e;
  }
}

$("刷新").onclick = () => { 状态.页码 = 1; 拉数(); };
$("清筛").onclick = () => {
  $("任务").value = ""; $("来源").value = ""; $("判词").value = "债务"; 状态.组 = ""; 状态.页码 = 1; 拉数();
};
$("判词").onchange = () => { 状态.页码 = 1; 拉数(); };
$("每页").onchange = () => { 状态.页码 = 1; 拉数(); };
let 定时 = null;
function 排自动() {
  if (定时) { clearInterval(定时); 定时 = null; }
  if ($("自动").checked) 定时 = setInterval(拉数, 10000);
}
$("自动").onchange = 排自动;
拉数(); 排自动();
</script>
</body></html>
