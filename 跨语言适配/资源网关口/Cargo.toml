[package]
name = "v1-resource-gateway"
description = "资源网关口 —— 全平台唯一的资源出入口：资源声明 · 唯一出入口 · 默认拒绝"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "v1_resource_gateway"
path = "src/lib.rs"

[dependencies]
# 只能向下：契约 + 内核（`全局连接器与网关.md` 判据 5）。零第三方依赖。
# 不依赖 `装载入口` / `统一注册表`：资源**被访问**（底座不认识它的内部），
# 扩展**提供能力**（底座认识它的编号）——两者是接缝的两侧，不许合并（§七 最后一条）。
v1-contract = { path = "../../契约声明" }
v1-trace = { path = "../../运行内核/调用留痕" }
v1-dispatch = { path = "../../运行内核/调用调度" }
# 同层互依（并非向下跳层，判据 5 明写「同层不算违规」）：`黑盒体` 的**跨进程**实现要能把
# `(操作号, 输入槽表)` 送过 Unix socket。那条线上的字节形状**只有一份** ——
# `v1_adapter::线协议`，它就是**同一份** `跨语言适配/边界协议/边界协议.md` 的运行期实现。
# 借它 = 不造第二套协议；本关口只做「槽表 ↔ 线协议」的搬运，字节一个不亲手拼。
# 反向依赖不存在（`v1-adapter` 的 Cargo.toml 不依赖本 crate），故无环。
v1-adapter = { path = "../适配器实现" }
