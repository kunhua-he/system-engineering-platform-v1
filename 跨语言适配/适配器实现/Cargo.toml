[package]
name = "v1-adapter"
description = "适配器实现 —— 全平台唯一的适配器：读契约 · 装载内核 · 转发调用"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "v1_adapter"
path = "src/lib.rs"

[dependencies]
# 只能向下：契约 + 内核。不许依赖 对外接口面/，不许手写绑定，不许给某语言开专用通道。
v1-contract = { path = "../../契约声明" }
v1-loader = { path = "../../运行内核/装载入口" }
v1-registry = { path = "../../运行内核/统一注册表" }
v1-dispatch = { path = "../../运行内核/调用调度" }
# 通知口（台账 #80）：适配器公开面加一条通知腿，生命周期通知（装载/卸载/退出）才送得到扩展。
# 通知通道是内核节点（`运行内核/通知通道/`），仍是「跨语言适配 → 运行内核」的相邻下层边。
v1-notify = { path = "../../运行内核/通知通道" }
# 调用留痕（台账 #99）：调用路写留痕 + 公开面给「取留痕」的口。留痕是内核节点
# （`运行内核/调用留痕/`），仍是「跨语言适配 → 运行内核」的相邻下层边。
# **不另造第二套留痕**：缓冲形状只有 `v1_trace::留痕缓冲` 一份。
v1-trace = { path = "../../运行内核/调用留痕" }
