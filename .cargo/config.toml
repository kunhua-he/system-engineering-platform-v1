# 环境即虚拟环境：一切产物收在一个文件夹里（构建环境/），不往 ~/.cargo 或 /tmp 乱飞。
# 构建期不联网；内核零第三方依赖 ⇒ 仓库外没有任何东西能改变行为。

[net]
offline = true

[build]
# 全部构建产物只落这一处（相对仓库根）
target-dir = "构建环境/构建缓存"
# 本机 32 核：并行拉满，不做保守设置
jobs = 32
# 增量编译：改一个文件只重编该 crate
incremental = true

[alias]
# 闸 1：静态检查（默认档，只查类型不做代码生成）
"检查" = "check --workspace --locked"
# 闸 1 加强档：加 lint，告警即失败
"检查严" = "clippy --workspace --locked --all-targets -- -D warnings"
