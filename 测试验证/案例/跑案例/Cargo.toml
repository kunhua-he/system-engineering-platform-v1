[package]
name = "v1-case-runner"
description = "跑案例 —— 端到端主门禁：读案例 → 经适配器装载并调用 → 比对期望 → 追加运行回执"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "v1-case-runner"
path = "src/main.rs"

[dependencies]
# 装载与调用**一律经适配器的公开面**（`装载声明根` / `调用能力` / `能力清单` / `能力契约`）。
# 本 crate 里没有 `v1_loader::载入` 的调用点 —— 有第二个就是第二条腿（拓扑判据 3）。
v1-adapter = { path = "../../../跨语言适配/适配器实现" }
# 契约生成物：类型标签（唯一来源 `契约声明/类型声明/*.json`，不许在这里再写一份数）。
v1-contract = { path = "../../../契约声明" }
# 底座声明：装载声明根的第一份（内核错误码表只有经它才取得到）。
v1-loader = { path = "../../../运行内核/装载入口" }
# 被验的扩展：只经它的 `GetPlatformInfo` 接缝取声明，不 import 它的任何实现。
v1-compiler = { path = "../../../扩展根目录/原子支持库/编译器支持库" }
# 运行数据根：第二份支持库走制品装载，解包要一个**仓外**缓存目录（`装载件缓存` 的唯一口径）。
v1-dataroot = { path = "../../../运行内核/运行数据根" }

[lints]
workspace = true
