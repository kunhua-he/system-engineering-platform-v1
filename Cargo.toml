# 系统工程平台 V1 · 底座工作区
#
# 只放底座。支持库 / 模块 / 技能是可热载入的扩展，各自成仓（见 README 第五节）。
# 内核 crate 一律零第三方依赖——仓库外没有任何东西能改变行为。
[workspace]
resolver = "3"
members = [
    "契约声明",
    "运行内核/定长数据槽",
    "运行内核/统一注册表",
    "运行内核/装载入口",
    "运行内核/通知通道",
    "运行内核/内存分配器",
    "运行内核/实例状态",
    "运行内核/调用调度",
    "运行内核/调用留痕",
    "跨语言适配/适配器实现",
    "跨语言适配/资源网关口",
    "对外接口面/调用接口面",
    # 端到端主门禁（测试验证/案例/形状.md）：读案例 → 经适配器装载并调用 → 追加运行回执。
    # 它不是底座的一条腿：底座不认识任何扩展，而它必须认识被验的那个扩展。
    "测试验证/案例/跑案例",
]
# 扩展是**独立工作区**（底座不认识任何扩展）。跑案例要经它的 `GetPlatformInfo` 接缝取声明，
# 所以它是一条 path 依赖；而它自己带 `[workspace]` 表 ⇒ 必须在这里 exclude，
# 否则 cargo 报「multiple workspace roots found in the same workspace」。
# exclude 只把它从**本工作区的成员**里摘出去，不改变它的独立工作区身份，也不改它一个字。
exclude = [
    "扩展根目录/原子支持库/编译器支持库",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# 冻结：不许加第三方依赖。加之前先问"它会不会改变行为"，答不上来就不加。
[workspace.dependencies]

[profile.release]
# 制品形态裁剪：静态链接、无运行时、按体积与确定性优先。
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
