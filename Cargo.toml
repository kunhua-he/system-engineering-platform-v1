# 系统工程平台 V1 · 底座工作区
#
# 只放底座。支持库 / 模块 / 技能是可热载入的扩展，各自成仓（见 README 第五节）。
# 内核 crate 一律零第三方依赖——仓库外没有任何东西能改变行为。
[workspace]
resolver = "3"
members = [
    "契约声明",
    "运行内核/定长数据槽",
    "运行内核/统一注册表",
    "运行内核/装载入口",
    "运行内核/通知通道",
    "运行内核/内存分配器",
    "运行内核/实例状态",
    "运行内核/调用调度",
    "运行内核/调用留痕",
    # 第 13 个唯一物（README 第十一节未定项）：全平台运行数据的唯一落点。
    # 零依赖——它不碰契约、不碰任何别的内核节点，只回答「运行数据放哪」。
    "运行内核/运行数据根",
    "跨语言适配/适配器实现",
    "跨语言适配/资源网关口",
    "对外接口面/调用接口面",
    # 端到端主门禁（测试验证/案例/形状.md）：读案例 → 经适配器装载并调用 → 追加运行回执。
    # 它不是底座的一条腿：底座不认识任何扩展，而它必须认识被验的那个扩展。
    "测试验证/案例/跑案例",
]
# 扩展是**独立工作区**（底座不认识任何扩展）。跑案例要经它的 `GetPlatformInfo` 接缝取声明，
# 所以它是一条 path 依赖；而它自身带 `[workspace]` 表 ⇒ 必须在这里 exclude，
# 否则 cargo 报「multiple workspace roots found in the same workspace」。
# exclude 只把它从**本工作区的成员**里摘出去，不改变它的独立工作区身份，也不改它一个字。
exclude = [
    "扩展根目录/原子支持库/编译器支持库",
]

# ── Clippy 严格基线（`cargo clippy --workspace --locked --all-targets -- -D warnings` 全绿）──
#
# 为什么住这里：`[workspace.lints]` 是**唯一一处**，成员只写 `lints.workspace = true` 继承 ——
# 四条腿各写一份必然漂移。
#
# 这两条是**工具链强制例外**（不是「修不了就算了」）：`non_snake_case` · `uncommon_codepoints`
# —— 标识符一律中文（`开发规范.md` §六），中文没有大小写，snake_case 判据对它恒不成立。
# 与各 crate 已有的 `#![allow(uncommon_codepoints)]` 同源。
#
# ★ `dead_code` / `unused_imports` **不放这里**：放这里 = 整仓所有代码都豁免，会把真正没人用的
#   手写件一起放过去。实查：这两类告警**全部**落在扩展 crate（生成数据表 / `#[cfg(test)]`
#   子树 / 扫描器登记面）⇒ 按 crate 精确放行，见
#   `扩展根目录/原子支持库/编译器支持库/Cargo.toml` 的 `[lints.rust]`。
#
# 除上述外**一律不许 allow**：`clippy --fix` 能修的一律真修（本基线上线时已修
# `useless_conversion` / `needless_borrow` / `unnecessary_map_or` / `unused_mut` /
# `redundant_field_names` / `collapsible_if` / `manual_is_multiple_of` /
# `items_after_test_module` / `bool_assert_comparison` / `useless_format` 等）。
[workspace.lints.rust]
non_snake_case = "allow"
uncommon_codepoints = "allow"

[workspace.lints.clippy]
# 本工作区没有需要整组放行的 clippy 规则 —— 有告警就真修。

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

# 冻结：不许加第三方依赖。加之前先问"它会不会改变行为"，答不上来就不加。
[workspace.dependencies]

[profile.release]
# 制品形态裁剪：静态链接、无运行时、按体积与确定性优先。
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
