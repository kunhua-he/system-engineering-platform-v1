[package]
name = "v1-gateway"
description = "调用接口面 —— 全平台唯一的对外门（全局网关）：协议翻译 + 转调适配器"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "v1_gateway"
path = "src/lib.rs"

[dependencies]
# 唯一腿：只依赖 跨语言适配/适配器实现。
# 不依赖 契约声明/ · 运行内核/ —— 那是**跳层**（`全局连接器与网关.md` 第四节判据 5），
# 一跳层就等于给下层开了第二条腿。契约版本与声明格式号从**注入的声明**上现读。
v1-adapter = { path = "../../跨语言适配/适配器实现" }

[dev-dependencies]
# **只为测试**：起服务要一份声明根，而适配器公开面**给不出也构造不出**声明 ——
#   · 没有「取底座声明」的口（`v1_loader::底座声明()` 没被再导出）；
#   · 也没有构造声明要用的类型（`表段` / `参数信息` / `命令信息` / `错误码表` /
#     `版本三元组` / `号段` / `执行函数` 一个都没再导出），所以连一份 `#[cfg(test)]`
#     合成声明都写不出来。
# ⇒ 测试只能直接挂 `v1-loader`。**这是判据 5（不许跳层）在 dev-dependencies 上的一处
#   实测破口**：生产依赖边仍只有 1 条（`v1-adapter`），但 `cargo metadata` 里会多一条测试边。
#   修法在适配器（再导出 `底座声明` 与构造声明要用的那几个类型），不在网关里绕。
v1-loader = { path = "../../运行内核/装载入口" }
