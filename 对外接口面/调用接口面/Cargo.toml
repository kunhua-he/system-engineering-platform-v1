[package]
name = "v1-gateway"
description = "调用接口面 —— 全平台唯一的对外门（全局网关）：协议翻译 + 转调适配器"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "v1_gateway"
path = "src/lib.rs"

[dependencies]
# 唯一腿：只依赖 跨语言适配/适配器实现。
# 不依赖 契约声明/ · 运行内核/ —— 那是**跳层**（`全局连接器与网关.md` 第四节判据 5），
# 一跳层就等于给下层开了第二条腿。契约版本与声明格式号从**注入的声明**上现读。
v1-adapter = { path = "../../跨语言适配/适配器实现" }

[lints]
workspace = true
