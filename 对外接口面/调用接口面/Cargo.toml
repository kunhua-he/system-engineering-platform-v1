[package]
name = "v1-gateway"
description = "调用接口面 —— 全平台唯一的对外门（全局网关）：协议翻译 + 转调适配器"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "v1_gateway"
path = "src/lib.rs"

[dependencies]
# 唯一腿：只依赖 跨语言适配/适配器实现。
# 不依赖 契约声明/ · 运行内核/ —— 那是**跳层**（`全局连接器与网关.md` 第四节判据 5），
# 一跳层就等于给下层开了第二条腿。契约版本与声明格式号从**注入的声明**上现读。
v1-adapter = { path = "../../跨语言适配/适配器实现" }

[dev-dependencies]
# **只为测试**：起服务要一份声明根。适配器公开面现在**已再导出** `底座声明` 与构造声明
# 要用的那组类型（`表段` / `参数信息` / `命令信息` / `错误码信息` / `版本三元组` / `号段` /
# `执行函数` / `能力号` / `类型标签` / `声明数据`），所以**新写的测试**（`tests/` 集成测试）
# 经 `v1_adapter::底座声明` 取即可，不再需要这条边。
#
# ★ 这条 dev-dependency 边**还没拆掉**（判据 5「不许跳层」在 dev-dependencies 上的破口仍在，
#   `cargo metadata` 里会多一条测试边）：网关里还有三处 `v1_loader::底座声明()` 调用点 ——
#   `src/测试夹具.rs` · `src/接口面测试/端点测试.rs` · `examples/启动网关/装配.rs`。
#   把它们逐处换成 `v1_adapter::底座声明()` 之后，本段整块删掉即可（那三件属网关自己的腿）。
v1-loader = { path = "../../运行内核/装载入口" }
